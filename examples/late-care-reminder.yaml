blueprint:
  name: Smart Home Health · Late care reminder
  domain: automation
  description: >
    Enable Schedule details under the care profile’s Home Assistant reminders.
    Choose that sensor and the caregiver phones that should receive its item names and due times.
    You can also announce overdue reminders on selected voice satellites.
  input:
    schedule:
      name: Schedule details sensor
      selector:
        entity:
          filter:
            - domain: sensor
              integration: mqtt
    phone:
      name: Caregiver phone
      selector:
        device:
          filter:
            - integration: mobile_app
    additional_phones:
      name: Additional caregiver phones
      description: Select any other phones that should receive the same reminder. Requires Home Assistant 2026.5 or later.
      default: []
      selector:
        device:
          multiple: true
          entity:
            - domain: notify
              integration: mobile_app
    announcement_satellites:
      name: Voice satellites
      description: Select the Assist satellites that should announce how many care items are overdue.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: assist_satellite
              supported_features:
                - assist_satellite.AssistSatelliteEntityFeature.ANNOUNCE
    speak_item_names:
      name: Speak overdue item names
      description: Include the names of up to three overdue items in each spoken reminder.
      default: false
      selector:
        boolean: {}
    repeat_minutes:
      name: Minutes between reminders
      default: 30
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
          mode: box

mode: single
variables:
  repeat_minutes: !input repeat_minutes
  primary_phone: !input phone
  additional_phones: !input additional_phones
  announcement_satellites: !input announcement_satellites
  speak_item_names: !input speak_item_names
triggers:
  # The sensor publishes a dated snapshot every minute, even if the count is unchanged.
  - trigger: state
    entity_id: !input schedule
conditions:
  - condition: template
    value_template: >-
      {% set current = trigger.to_state %}
      {% set previous = trigger.from_state %}
      {% set age = as_timestamp(now()) - as_timestamp(current.attributes.generated_at, 0) if current else -1 %}
      {% set late = current.attributes.get('late', []) if current else [] %}
      {{ current is not none and current.state not in ['unknown', 'unavailable']
         and 0 <= age < 180 and late | length > 0
         and current.attributes.get('late_count', -1) | int(-1) == late | length
         and (previous is none or previous.state in ['unknown', 'unavailable']
              or previous.attributes.get('late', []) | length == 0
              or as_timestamp(now()) - as_timestamp(this.attributes.get('last_triggered'), 0)
                 >= repeat_minutes | int * 60) }}
actions:
  - device_id: !input phone
    domain: mobile_app
    type: notify
    continue_on_error: true
    title: &reminder_title "{{ trigger.to_state.attributes.late | length }} overdue · {{ trigger.to_state.name }}"
    message: &reminder_message |-
      {%- macro line(item) -%}
      {{ item.category }} · {{ item.name }} — due {{ (as_timestamp(item.due_at) | timestamp_custom('%a %-I:%M %p', true)) if item.due_at is defined else item.due_date }}
      {%- endmacro -%}
      {%- set data = trigger.to_state.attributes -%}
      {%- if data.details is defined -%}
      {{ data.details }}
      {%- else -%}
      {%- for item in data.late -%}
      {{ line(item) }}{{ '\n' if not loop.last else '' }}
      {%- endfor -%}
      {%- if data.upcoming -%}
      {{ '\n\nUpcoming\n' }}
      {%- for item in data.upcoming -%}
      {{ line(item) }}{{ '\n' if not loop.last else '' }}
      {%- endfor -%}
      {%- endif -%}
      {%- endif -%}
  - repeat:
      for_each: "{{ additional_phones | reject('eq', primary_phone) | unique | list }}"
      sequence:
        - action: notify.send_message
          continue_on_error: true
          target:
            device_id: "{{ repeat.item }}"
          data:
            title: *reminder_title
            message: *reminder_message
  - if:
      - condition: template
        value_template: "{{ announcement_satellites | length > 0 }}"
    then:
      - action: assist_satellite.announce
        continue_on_error: true
        target:
          entity_id: !input announcement_satellites
        data:
          message: >-
            {% set late = trigger.to_state.attributes.late -%}
            {% set count = late | length -%}
            {{ count }} care {{ 'item is' if count == 1 else 'items are' }} overdue.
            {%- if speak_item_names %}
              {{ late[:3] | map(attribute='name') | join(', ') }}{% if count > 3 %}, and {{ count - 3 }} more{% endif %}.
            {%- endif %}
