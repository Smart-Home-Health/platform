name: CI

# Runs the automated test suites on every push to a long-lived branch and on
# every PR. Backend uses the same ephemeral-Timescale gate as scripts/run_tests.sh;
# frontend runs lint + Vitest + a production build.
on:
  push:
    branches: [main, "dev/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + Timescale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backend test gate
        # Builds the backend image, spins up an ephemeral TimescaleDB, runs the
        # full pytest suite in a one-shot container, exits non-zero on failure.
        run: bash scripts/run_tests.sh

  acme-integration:
    name: ACME integration (pebble, non-blocking)
    runs-on: ubuntu-latest
    # The real-ACME round-trip depends on external images (pebble); surface
    # failures without gating merges on them.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run pebble ACME tests
        run: |
          docker compose -p shh_acme_test -f docker-compose.acme-test.yml \
            up --build --abort-on-container-exit --exit-code-from tests
      - name: Tear down
        if: always()
        run: docker compose -p shh_acme_test -f docker-compose.acme-test.yml down -v --remove-orphans

  frontend:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        # Backlog cleared (issue #39) — lint is a hard gate, and the npm
        # script runs eslint with --max-warnings 0.
        run: npm run lint
      - name: Unit tests (Vitest)
        # TZ is pinned in the npm script; keep it deterministic here too.
        run: npm test
      - run: npm run build
