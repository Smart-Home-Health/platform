<!doctype html>
<html lang="en">
  <head>
    <!-- Base path for Home Assistant ingress. The backend rewrites this <base>
         (and window.__BASE_PATH__) to the ingress prefix when served behind HA;
         in dev and the normal unified image it stays "/". Must come first so the
         relative URLs below resolve against it. -->
    <base href="/" />
    <script>window.__BASE_PATH__ = "";</script>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <!-- Apply the saved appearance before React mounts so there is no flash of
         the wrong palette. Mirrors contexts/ThemeContext.jsx: `light` and `hc`
         classes on <html>, nothing at all for the dark default. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');        // "light" | "dark" | "system"
          var c = localStorage.getItem('contrast');     // "normal" | "high"
          var theme = (t === 'light' || t === 'dark') ? t
            : t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : 'dark';
          var hc = c === 'high';
          var el = document.documentElement;
          el.classList.toggle('light', theme === 'light');
          el.classList.toggle('hc', hc);
          var colors = { dark: '#0a0e14', light: '#e6e1d8', 'dark-hc': '#000000', 'light-hc': '#ffffff' };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', colors[theme + (hc ? '-hc' : '')]);
        } catch (e) { /* dark default needs no class */ }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SHH" />
    <title>Smart Home Health</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
